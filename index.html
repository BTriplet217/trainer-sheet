<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer Sheet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8302C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#1C2330; --muted:#5B6676; --line:#D3D9E0;
  --red:#C8302C; --on-red:#FFFFFF; --yellow:#F2C230; --soft:#E4E8ED;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141922; --card:#1D2430; --ink:#E8ECF2; --muted:#9AA6B5; --line:#2F3947;
    --red:#B8322E; --on-red:#FFFFFF; --yellow:#F2C230; --soft:#262F3D;
  }
}
:root[data-theme="dark"]{
  --paper:#141922; --card:#1D2430; --ink:#E8ECF2; --muted:#9AA6B5; --line:#2F3947;
  --red:#B8322E; --on-red:#FFFFFF; --yellow:#F2C230; --soft:#262F3D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;
  padding:2px 0;min-width:0;width:100%}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--yellow)}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);color:var(--on-red);
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px}
.lv{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1C2330;position:relative;
  display:grid;place-items:center}
.lv::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#1C2330;opacity:.18}
.lv input{position:relative;text-align:center;color:#1C2330;font:700 20px "Chakra Petch",system-ui,sans-serif;border:0}
.who input{display:block}
.who .name{font:700 20px/1.1 "Chakra Petch",system-ui,sans-serif}
.who .cls{font-size:13px;opacity:.9}
.money{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.2);border-radius:6px;padding:2px 8px;
  font:600 16px "Chakra Petch",system-ui,sans-serif}
.money input{width:6ch;text-align:right;font:inherit}
.top input:focus{border-bottom-color:#fff}

main{max-width:760px;margin:0 auto;padding:10px 10px 28px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 10px}
h2{font:600 15px "Chakra Petch",system-ui,sans-serif;margin:0 0 6px;display:flex;align-items:center;gap:8px}
h2 .grow{flex:1}
.link{font:500 13px system-ui,sans-serif;color:var(--muted);text-decoration:underline;padding:6px 2px}

.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:520px){.team{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mon{min-width:0;display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:6px;padding:2px 6px}
.star{font-size:18px;line-height:1;width:28px;height:32px;color:var(--muted);opacity:.45}
.star[aria-pressed="true"]{color:var(--yellow);opacity:1}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
.act{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:34px}
.act span{flex:1;font-size:14px}
.act input{width:3.2ch;text-align:center;font:600 16px "Chakra Petch",system-ui,sans-serif;
  background:var(--soft);border-radius:4px;border-bottom:0;padding:3px 0}
.act input:focus{box-shadow:0 0 0 2px var(--yellow)}

.filter{background:var(--soft);border-radius:6px;padding:6px 10px;margin-bottom:4px;border-bottom:0}
.cat{margin-top:8px}
.cat-h{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--red);padding-bottom:1px}
.cat-h input{font:600 14px "Chakra Petch",system-ui,sans-serif;flex:1}
.item{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;
  border-bottom:1px solid var(--line);padding:2px 0;min-height:38px}
.item.out .txt{opacity:.45}
.txt{min-width:0}
.txt .note{font-size:13px;color:var(--muted);padding:0}
.txt .note.empty{display:none}
.item:focus-within .note.empty, body.editing .note.empty{display:block}
.step{display:flex;align-items:center;gap:2px}
.step button{width:34px;height:34px;border-radius:6px;background:var(--soft);font-size:20px;line-height:1}
.step button:active{background:var(--yellow);color:#1C2330}
.step output{width:2.4ch;text-align:center;font:600 16px "Chakra Petch",system-ui,sans-serif}
.del{display:none;width:30px;height:34px;color:var(--red);font-size:20px}
body.editing .del{display:block}
.only-edit{display:none}
body.editing .only-edit{display:inline-block}
[hidden]{display:none!important}

.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:14px}
.kv label{color:var(--muted)}
textarea{resize:none;overflow:hidden;display:block;font-size:15px}
.status{text-align:center;font-size:12px;color:var(--muted);padding:4px}

.monb{flex:1;min-width:0;text-align:left;padding:6px 2px;display:flex;flex-direction:column;min-height:44px;justify-content:center}
.monb b{font:600 15px "Chakra Petch",system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.monb small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:560px;height:100%;max-height:100%;margin:0 auto;overflow:auto}
@media (min-width:600px){dialog{height:auto;max-height:92vh;border-radius:10px;margin:auto}}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{position:sticky;top:0;z-index:2;background:var(--red);color:var(--on-red);display:grid;grid-template-columns:auto 1fr auto;
  gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.dh input:focus{border-bottom-color:#fff}
.close{background:rgba(0,0,0,.25);border-radius:6px;padding:10px 14px;font:600 14px "Chakra Petch",system-ui,sans-serif}
.dbody{padding:10px 10px calc(20px + env(safe-area-inset-bottom,0px))}
.row3{display:grid;grid-template-columns:1fr 64px auto;gap:10px;align-items:end}
.fl{display:block;margin-top:4px}
.lab{display:block;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--soft);border-radius:6px;padding:4px 6px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat input{text-align:center;font:600 18px "Chakra Petch",system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;border-radius:999px;background:var(--soft);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.cond .chip[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.move{border:1px solid var(--line);border-radius:8px;margin-top:6px;padding:6px 8px}
.move-h{display:flex;gap:8px;align-items:center}
.pw{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.pw input{text-align:center;font:700 16px "Chakra Petch",system-ui,sans-serif;border:0}
.mn{font:600 16px "Chakra Petch",system-ui,sans-serif}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;z-index:20;
  background:var(--ink);color:var(--card);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{color:var(--yellow);font-weight:600;padding:6px 4px;flex:none}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<dialog id="dlg" aria-label="Pokémon details"></dialog>
<div class="status" id="status" role="status"></div>
<script type="application/json" id="seed">{}</script>
<script>
(function(){
"use strict";
var LS="trainer-sheet-v1", ACTIONS=["Search Pokémon","Catch Pokémon","Shiny Pokémon Luck","Scout Terrain","Ride Pokémon","Train Pokémon","Breed Pokémon","Craft Items","Knowledge","Perception","Persuasion","Intimidate","Stealth"];
var STATS=[["hp","HP"],["sp","SP"],["atk","ATK"],["def","DEF"],["satk","S.ATK"],["sdef","S.DEF"]],
  FRIEND=["Wild","Tame","Friendly","Partner","BFFs"],CONDS=["Asleep","Burned","Confused","Frozen","Infatuated","Paralyzed","Poisoned"];
var PARTY={};
function mon(m){var k;
  if(!m.moves){var p=PARTY[String(m.n||"").trim().toLowerCase()];if(p){p=JSON.parse(JSON.stringify(p));for(k in p)m[k]=p[k]}}
  var d={nick:"",lv:"",type:"",sex:"",friend:"",held:"",heldNote:"",ability:"",weak:"",resist:"",immune:""};
  for(k in d)if(m[k]==null)m[k]=d[k];
  if(!m.stats)m.stats={};STATS.forEach(function(s){if(m.stats[s[0]]==null)m.stats[s[0]]=""});
  if(!Array.isArray(m.cond))m.cond=[];
  if(!Array.isArray(m.moves))m.moves=[];
  while(m.moves.length<4)m.moves.push({n:"",p:"",el:"",ty:"",acc:"",fx:""});
  return m}
function blank(){return {updated:0,name:"",level:"1",cls:"",money:"0",badges:"",perk:"",features:"",notes:"",
  team:[0,1,2,3,4,5].map(function(){return mon({n:"",star:false,moves:[]})}),
  actions:ACTIONS.map(function(n){return {n:n,v:""}}),
  bag:[{cat:"Poké Balls",items:[]},{cat:"Healing",items:[]}]};}
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalize(s){var b=blank();for(var k in b){if(s[k]===undefined||s[k]===null)s[k]=b[k]}
  if(!Array.isArray(s.team))s.team=b.team; if(!Array.isArray(s.actions))s.actions=b.actions; if(!Array.isArray(s.bag))s.bag=b.bag;
  s.bag.forEach(function(c){if(!Array.isArray(c.items))c.items=[];c.items=c.items.filter(function(it){return it&&Number(it.q)>0})});s.team.forEach(mon);return s}

var state=blank(), db=null, ref=null, timer=null, saving=false, again=false, dirty=false, filterText="";
try{state=normalize(JSON.parse(document.getElementById("seed").textContent))}catch(e){}
try{var c=localStorage.getItem(LS); if(c){c=normalize(JSON.parse(c)); if((c.updated||0)>=(state.updated||0)) state=c}}catch(e){}

var statusEl=document.getElementById("status");
function status(t){statusEl.textContent=t}
var toastEl=null,toastT=null;
function toast(it,c,ii){if(toastEl)toastEl.remove();clearTimeout(toastT);
  toastEl=document.createElement("div");toastEl.className="toast";toastEl.setAttribute("role","status");
  var s=document.createElement("span");s.textContent="Removed "+(it.n||"blank item");
  var u=document.createElement("button");u.type="button";u.textContent="Undo";
  u.addEventListener("click",function(){it.q=1;if(state.bag.indexOf(c)<0)state.bag.push(c);c.items.splice(Math.min(ii,c.items.length),0,it);touch();render();toastEl.remove();toastEl=null});
  toastEl.appendChild(s);toastEl.appendChild(u);document.body.appendChild(toastEl);
  toastT=setTimeout(function(){if(toastEl){toastEl.remove();toastEl=null}},6000)}

function touch(){state.updated=Date.now();dirty=true;
  try{localStorage.setItem(LS,JSON.stringify(state));status("Saved on this device")}
  catch(e){status("Couldn't save. This browser is blocking storage, so download a backup now.")}
  clearTimeout(timer);timer=setTimeout(save,700)}
function save(retried){
  if(!ref){dirty=false;return}
  if(saving){again=true;return}
  saving=true;dirty=false;
  ref.set(clone(state)).then(function(){saving=false;status("Saved");if(again){again=false;save()}},
    function(e){saving=false;
      if(e&&e.code==="unavailable"&&!retried){setTimeout(function(){save(true)},600+Math.random()*600);return}
      status("Couldn't save online. Your changes are kept on this device.")})}

function el(tag,attrs){var n=document.createElement(tag),i,k;
  if(attrs)for(k in attrs){if(k==="text")n.textContent=attrs[k];else if(k==="on"){for(var ev in attrs.on)n.addEventListener(ev,attrs.on[ev])}
    else if(k==="cls")n.className=attrs[k];else n.setAttribute(k,attrs[k])}
  for(i=2;i<arguments.length;i++)if(arguments[i])n.appendChild(arguments[i]);return n}
function field(obj,key,o){o=o||{};var i=el(o.area?"textarea":"input",{cls:o.cls||"","aria-label":o.label||key,placeholder:o.ph||""});
  if(!o.area)i.type="text"; if(o.num)i.setAttribute("inputmode","numeric"); if(o.area)i.rows=1;
  i.value=obj[key]==null?"":obj[key];
  i.addEventListener("input",function(){obj[key]=i.value;if(o.area)grow(i);if(o.after)o.after(i);touch()});
  i.setAttribute("autocomplete","off");return i}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}

function render(focusSel){
  var top=document.getElementById("top"),main=document.getElementById("main");
  top.textContent="";main.textContent="";
  top.appendChild(el("div",{cls:"lv"},field(state,"level",{label:"Level",num:true})));
  top.appendChild(el("div",{cls:"who"},field(state,"name",{cls:"name",label:"Trainer name",ph:"Trainer name"}),
    field(state,"cls",{cls:"cls",label:"Trainer class",ph:"Trainer class"})));
  top.appendChild(el("label",{cls:"money"},el("span",{text:"₽"}),field(state,"money",{label:"Money",num:true})));

  // Team
  var team=el("div",{cls:"team"});
  state.team.forEach(function(m,i){
    var sub=[];if(m.nick&&m.n)sub.push(m.n);if(m.lv)sub.push("Lv "+m.lv);if(m.cond.length)sub.push(m.cond.join(", "));
    var b=el("button",{cls:"monb",type:"button","aria-label":"Open "+(m.nick||m.n||"empty slot "+(i+1))},
      el("b",{text:(m.star?"★ ":"")+(m.nick||m.n||"Empty slot")}),el("small",{text:sub.join(" · ")||(m.n?"Tap for details":"Tap to add")}));
    b.addEventListener("click",function(){openMon(i)});
    team.appendChild(el("div",{cls:"mon"},b))});
  main.appendChild(el("section",null,el("h2",{text:"Team"}),team));

  // Actions
  var acts=el("div",{cls:"acts"});
  state.actions.forEach(function(a){acts.appendChild(el("label",{cls:"act"},el("span",{text:a.n}),field(a,"v",{label:a.n,num:true,ph:"–"})))});
  main.appendChild(el("section",null,el("h2",{text:"Trainer actions"}),acts));

  // Bag
  var bag=el("section",{id:"bag"});
  var edit=el("button",{cls:"link",type:"button",text:document.body.classList.contains("editing")?"Done":"Edit items"});
  edit.addEventListener("click",function(){document.body.classList.toggle("editing");edit.textContent=document.body.classList.contains("editing")?"Done":"Edit items"});
  bag.appendChild(el("h2",null,el("span",{cls:"grow",text:"Bag"}),edit));
  var f=el("input",{cls:"filter",type:"search",placeholder:"Find an item","aria-label":"Find an item"});
  f.value=filterText;f.addEventListener("input",function(){filterText=f.value;applyFilter()});
  bag.appendChild(f);
  state.bag.forEach(function(c,ci){
    var wrap=el("div",{cls:"cat"});
    var add=el("button",{cls:"link",type:"button",text:"Add item"});
    add.addEventListener("click",function(){c.items.push({n:"",q:1,note:""});touch();render('[data-i="'+ci+"-"+(c.items.length-1)+'"] .nm')});
    var delc=el("button",{cls:"link only-edit",type:"button",text:"Remove type"});
    delc.addEventListener("click",function(){if(c.items.length&&!delc.armed){delc.armed=true;delc.textContent="Tap again to remove "+c.items.length+" items";return}state.bag.splice(ci,1);touch();render()});
    wrap.appendChild(el("div",{cls:"cat-h"},field(c,"cat",{label:"Item type",ph:"Item type"}),delc,add));
    c.items.forEach(function(it,ii){
      var row=el("div",{cls:"item"+(Number(it.q)>0?"":" out"),"data-i":ci+"-"+ii});
      var note=field(it,"note",{cls:"note"+(it.note?"":" empty"),label:"Note",ph:"Add a note",after:function(n){n.classList.toggle("empty",!n.value)}});
      var out=el("output",{text:String(it.q)});
      function bump(d){it.q=Math.max(0,(Number(it.q)||0)+d);if(it.q<=0){c.items.splice(ii,1);touch();render();toast(it,c,ii);return}out.textContent=String(it.q);touch()}
      var minus=el("button",{type:"button","aria-label":"Use one "+(it.n||"item"),text:"−",on:{click:function(){bump(-1)}}});
      var plus=el("button",{type:"button","aria-label":"Add one "+(it.n||"item"),text:"+",on:{click:function(){bump(1)}}});
      var del=el("button",{cls:"del",type:"button","aria-label":"Remove "+(it.n||"item"),text:"×"});
      del.addEventListener("click",function(){c.items.splice(ii,1);touch();render()});
      row.appendChild(el("div",{cls:"txt"},field(it,"n",{cls:"nm",label:"Item name",ph:"Item name",after:applyFilter}),note));
      row.appendChild(el("div",{cls:"step"},minus,out,plus));
      row.appendChild(del);
      wrap.appendChild(row)});
    bag.appendChild(wrap)});
  var addc=el("button",{cls:"link",type:"button",text:"Add item type"});
  addc.addEventListener("click",function(){state.bag.push({cat:"",items:[]});touch();render()});
  bag.appendChild(addc);
  main.appendChild(bag);

  // Trainer details
  var kv=el("div",{cls:"kv"});
  kv.appendChild(el("label",{text:"Badges"}));kv.appendChild(field(state,"badges",{label:"Badges",ph:"None yet"}));
  kv.appendChild(el("label",{text:"Perks"}));kv.appendChild(field(state,"perk",{label:"Perks",ph:"None yet"}));
  main.appendChild(el("section",null,el("h2",{text:"Badges and perks"}),kv));
  var feat=field(state,"features",{area:true,label:"Class features",ph:"Class features and skill tree"});
  main.appendChild(el("section",null,el("h2",{text:"Class features"}),feat));
  var notes=field(state,"notes",{area:true,label:"Notes",ph:"Session notes"});
  main.appendChild(el("section",null,el("h2",{text:"Notes"}),notes));
  grow(feat);grow(notes);applyFilter();
  if(focusSel){var t=document.querySelector(focusSel);if(t)t.focus()}
}
function applyFilter(){var q=filterText.trim().toLowerCase();
  document.querySelectorAll("#bag .cat").forEach(function(c){var any=false;
    c.querySelectorAll(".item").forEach(function(r){var nm=r.querySelector(".nm"),nt=r.querySelector(".note");
      var show=!q||(nm.value+" "+nt.value).toLowerCase().indexOf(q)>=0||document.activeElement===nm;r.hidden=!show;if(show)any=true});
    c.hidden=!!q&&!any})}

var dlg=document.getElementById("dlg");
dlg.addEventListener("close",function(){render()});
function closeDlg(){if(dlg.close)dlg.close();else{dlg.removeAttribute("open");render()}}
function chipset(list,isOn,toggle,cls){var w=el("div",{cls:"chips "+(cls||"")});
  list.forEach(function(name){var b=el("button",{cls:"chip",type:"button",text:name,"aria-pressed":String(isOn(name))});
    b.addEventListener("click",function(){toggle(name);w.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(isOn(c.textContent)))});touch()});
    w.appendChild(b)});return w}
function lab(t,node){return el("label",{cls:"fl"},el("span",{cls:"lab",text:t}),node)}
function openMon(i){var m=state.team[i];dlg.textContent="";
  var x=el("button",{cls:"close",type:"button",text:"Done",autofocus:""});x.addEventListener("click",closeDlg);
  dlg.appendChild(el("div",{cls:"dh"},el("div",{cls:"lv"},field(m,"lv",{label:"Level",num:true})),
    el("div",{cls:"who"},field(m,"nick",{cls:"name",label:"Nickname",ph:"Nickname"}),field(m,"n",{cls:"cls",label:"Pokémon",ph:"Pokémon"})),x));
  var body=el("div",{cls:"dbody"});
  var star=el("button",{cls:"chip",type:"button",text:"★ Starred","aria-pressed":String(!!m.star)});
  star.addEventListener("click",function(){m.star=!m.star;star.setAttribute("aria-pressed",String(m.star));touch()});
  body.appendChild(el("section",null,el("div",{cls:"row3"},lab("Type",field(m,"type",{label:"Type",ph:"–"})),lab("Sex",field(m,"sex",{label:"Sex",ph:"–"})),star)));
  var st=el("div",{cls:"stats"});
  STATS.forEach(function(s){st.appendChild(el("label",{cls:"stat"},el("span",{text:s[1]}),field(m.stats,s[0],{label:s[1],num:true,ph:"–"})))});
  body.appendChild(el("section",null,el("h2",{text:"Stats"}),st));
  body.appendChild(el("section",null,el("h2",{text:"Friendship"}),chipset(FRIEND,function(n){return m.friend===n},function(n){m.friend=m.friend===n?"":n})));
  body.appendChild(el("section",null,el("h2",{text:"Conditions"}),chipset(CONDS,function(n){return m.cond.indexOf(n)>=0},
    function(n){var k=m.cond.indexOf(n);if(k>=0)m.cond.splice(k,1);else m.cond.push(n)},"cond")));
  var ab=field(m,"ability",{area:true,label:"Ability",ph:"–"}),areas=[ab];
  body.appendChild(el("section",null,el("h2",{text:"Held item and ability"}),lab("Held item",field(m,"held",{label:"Held item",ph:"None"})),
    lab("Item note",field(m,"heldNote",{label:"Item note",ph:"–"})),lab("Ability",ab)));
  body.appendChild(el("section",null,el("h2",{text:"Type matchups"}),lab("Weak ×2",field(m,"weak",{label:"Weak",ph:"–"})),
